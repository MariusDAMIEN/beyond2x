name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package
      - run: gh release create "${GITHUB_REF_NAME}" --generate-notes "release/beyond2x-v${GITHUB_REF_NAME#v}.zip"
        env:
          GH_TOKEN: ${{ github.token }}
